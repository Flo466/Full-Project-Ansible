<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$title$</title>
<style>
:root{
  /* ---------- palette : vert pastel, sobre et lisible ---------- */
  --hero:#e3efdb;          /* vert pastel : fond du hero */
  --hero-2:#d7e8cc;        /* pastel un peu plus dense : bord bas du hero */
  --card:#eaf3e4;          /* pastel : fond des cartes */
  --card-soon:#f4f9f0;     /* pastel tres clair : cartes a venir */
  --wash:#f1f7ed;          /* pastel pale : encadres, tableaux, code inline */
  --line:#cfe0c2;          /* filets verts clairs */
  --line-2:#b7d0a6;        /* filets verts appuyes */
  --green:#2f6b45;         /* vert de travail : liens, accents, puces */
  --green-ink:#1c3c26;     /* vert tres sombre : titres et labels */
  --white:#ffffff;         /* fond general de page */
  --ink:#14180f;           /* texte : quasi noir */
  --ink-2:#4d5648;         /* texte secondaire */
  --code-bg:#16201a;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
::selection{background:#cfe6c0;color:var(--ink)}
body{
  margin:0;background:var(--white);color:var(--ink);
  font-family:var(--sans);font-size:17px;line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:820px;margin:0 auto;padding:0 24px}
.wrap-wide{max-width:1020px;margin:0 auto;padding:0 24px}

/* ---------- hero pastel ---------- */
.masthead{
  background:var(--hero);
  border-bottom:3px solid var(--hero-2);
  padding:52px 0 46px;margin-bottom:38px;
}
.masthead .eyebrow{
  font-family:var(--mono);font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;
  color:var(--green-ink);margin:0 0 16px;font-weight:700}
.masthead h1{
  margin:0;font-size:2.3rem;line-height:1.22;font-weight:700;
  letter-spacing:-.018em;color:var(--ink);max-width:26ch}
.masthead .lede{
  margin:18px 0 0;font-size:1.06rem;color:var(--ink-2);max-width:64ch;line-height:1.62}
.masthead .stamp{
  font-family:var(--mono);font-size:.74rem;letter-spacing:.05em;color:var(--green-ink);
  margin:22px 0 0;padding-top:14px;border-top:1px solid var(--line-2)}

/* ---------- contexte ---------- */
.callout{
  background:var(--wash);border:1px solid var(--line);
  border-left:4px solid var(--green);border-radius:0 8px 8px 0;
  padding:20px 24px 18px;margin:0 0 36px}
.callout .tag{
  font-family:var(--mono);font-size:.7rem;letter-spacing:.17em;text-transform:uppercase;
  color:var(--green-ink);font-weight:700;display:block;margin-bottom:8px}
.callout p{margin:0;font-size:.99rem;color:var(--ink)}

/* ---------- sommaire par cartes ---------- */
.sec-title{font-size:1.05rem;font-weight:700;color:var(--ink);margin:0 0 18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:0 0 48px}
.card{
  display:flex;flex-direction:column;
  background:var(--card);border:1px solid var(--line);
  border-top:3px solid var(--green);border-radius:10px;
  padding:26px 26px 22px;text-decoration:none;color:inherit;
  transition:border-color .16s,transform .16s}
.card--main{grid-column:1 / -1}
a.card:hover{border-color:var(--green);transform:translateY(-2px)}
.card .no{
  font-family:var(--mono);font-size:.72rem;letter-spacing:.14em;
  color:var(--green-ink);font-weight:700;margin-bottom:12px}
.card h3{
  margin:0 0 10px;font-size:1.22rem;line-height:1.32;font-weight:700;
  letter-spacing:-.012em;color:var(--ink)}
.card--main h3{font-size:1.45rem}
.card p{margin:0 0 16px;font-size:.96rem;color:var(--ink-2);line-height:1.62}
.card .pills{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 16px}
.pill{
  font-family:var(--mono);font-size:.68rem;letter-spacing:.04em;
  background:var(--white);color:var(--green-ink);border:1px solid var(--line-2);
  border-radius:20px;padding:3px 11px}
.card .foot{
  margin-top:auto;font-size:.87rem;font-weight:700;color:var(--green);
  display:flex;align-items:center;gap:7px}
.card--soon{background:var(--card-soon);border-top-color:var(--line-2);border-style:dashed}
.card--soon .no{color:var(--ink-2)}
.card--soon h3{color:var(--ink-2)}
.card--soon .foot{color:var(--ink-2);font-weight:600}
.badge{
  font-family:var(--mono);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;
  background:var(--white);color:var(--ink-2);border:1px solid var(--line);
  border-radius:4px;padding:3px 8px;margin-left:auto}

/* ---------- article ---------- */
article{max-width:760px}
article h2{
  font-size:1.36rem;font-weight:700;letter-spacing:-.014em;color:var(--ink);
  margin:2.4em 0 .8em;padding-bottom:.4em;border-bottom:2px solid var(--line)}
article h3{font-size:1.09rem;font-weight:700;color:var(--green-ink);margin:1.9em 0 .5em}
article h4{font-size:.96rem;font-weight:700;color:var(--ink);margin:1.6em 0 .45em}
p{margin:0 0 1.1em}
a{color:var(--green);text-decoration:none;border-bottom:1px solid rgba(47,107,69,.4)}
a:hover{color:var(--green-ink);border-bottom-color:var(--green-ink)}
strong{font-weight:700;color:var(--ink)}

code{
  font-family:var(--mono);font-size:.85em;background:var(--wash);
  border:1px solid var(--line);border-radius:4px;padding:.1em .38em;color:var(--green-ink)}
pre,pre.sourceCode{
  background:var(--code-bg);color:#e6efe2;border-radius:8px;
  padding:18px 20px;overflow-x:auto;margin:0 0 1.5em;
  font-family:var(--mono);font-size:.83rem;line-height:1.62}
pre code,pre.sourceCode code{background:none;border:0;padding:0;color:inherit;font-size:inherit}

table{
  width:100%;border-collapse:collapse;margin:0 0 1.7em;font-size:.93rem;
  border:1px solid var(--line);border-radius:8px;overflow:hidden}
thead th{
  background:var(--wash);color:var(--green-ink);font-weight:700;
  text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);font-size:.87rem}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:last-child td{border-bottom:0}

blockquote{
  background:var(--wash);border:1px solid var(--line);
  border-left:4px solid var(--green);border-radius:0 8px 8px 0;
  padding:20px 24px 16px;margin:0 0 1.8em}
blockquote p{margin:0 0 .6em;font-size:.99rem}
blockquote p:last-child{margin-bottom:0}

ul,ol{margin:0 0 1.25em;padding-left:1.35em}
li{margin-bottom:.4em}
li::marker{color:var(--green)}

.back{
  display:inline-flex;align-items:center;gap:7px;font-size:.88rem;font-weight:700;
  color:var(--green);background:var(--wash);border:1px solid var(--line);
  border-radius:8px;padding:8px 15px;margin:0 0 28px}
.back:hover{border-color:var(--green);color:var(--green-ink);border-bottom-color:var(--green)}

footer{
  border-top:1px solid var(--line);margin-top:56px;padding:22px 0 48px;
  font-size:.83rem;color:var(--ink-2)}
footer p{margin:0}

@media (max-width:720px){
  body{font-size:16px}
  .grid{grid-template-columns:1fr}
  .masthead h1{font-size:1.72rem}
  .masthead .lede{font-size:1rem}
  article h2{font-size:1.22rem}
  .card{padding:22px 20px 18px}
}
@media print{
  .masthead{background:none;border-bottom:1px solid #000}
  .back,.card .foot{display:none}
  a{color:#000;border:0}
  pre,pre.sourceCode{background:#f2f2f2;color:#000}
}
</style>
</head>
<body>
<header class="masthead">
  <div class="wrap">
    <p class="eyebrow">Ansible &middot; Proxmox VE &middot; cloud-init</p>
    <h1>$title$</h1>
    
    <p class="stamp">Documentation technique &nbsp;·&nbsp; $date$</p>
  </div>
</header>
<main class="wrap">
<a class="back" href="index.html">&larr; Sommaire</a>
<article>
$body$
</article>
</main>
<footer><div class="wrap"><p>Dernière mise à jour : $date$</p></div></footer>
</body>
</html>
