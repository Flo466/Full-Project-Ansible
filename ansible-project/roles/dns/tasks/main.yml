---
- name: Installation de Bind9
  ansible.builtin.apt:
    name:
      - bind9
      - bind9-dnsutils
    state: present

- name: Configuration des options generales
  ansible.builtin.template:
    src: named.conf.options.j2
    dest: /etc/bind/named.conf.options
    owner: root
    group: bind
    mode: "0644"
  notify: Redemarrer Bind9

- name: Declaration de la zone
  ansible.builtin.template:
    src: named.conf.local.j2
    dest: /etc/bind/named.conf.local
    owner: root
    group: bind
    mode: "0644"
  notify: Redemarrer Bind9

- name: Deploiement du fichier de zone
  ansible.builtin.template:
    src: db.zone.j2
    dest: "/etc/bind/db.{{ dns_domain }}"
    owner: root
    group: bind
    mode: "0644"
  notify: Redemarrer Bind9

- name: Activation du service Bind9
  ansible.builtin.service:
    name: named
    state: started
    enabled: true
