---
- name: Installation d'Apache
  ansible.builtin.apt:
    name: apache2
    state: present

- name: Activation du service Apache
  ansible.builtin.service:
    name: apache2
    state: started
    enabled: true

- name: Deploiement de la page d'accueil NETSYS
  ansible.builtin.template:
    src: index.html.j2
    dest: "{{ site_root }}/index.html"
    owner: www-data
    group: www-data
    mode: "0644"
  notify: Redemarrer Apache
