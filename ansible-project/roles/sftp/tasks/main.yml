---
- name: Installation du serveur SSH
  ansible.builtin.apt:
    name: openssh-server
    state: present

- name: Creation du groupe SFTP
  ansible.builtin.group:
    name: "{{ sftp_group }}"
    state: present

- name: Creation du compte SFTP
  ansible.builtin.user:
    name: "{{ sftp_user }}"
    group: "{{ sftp_group }}"
    home: "{{ sftp_dir }}/{{ sftp_user }}"
    shell: /usr/sbin/nologin
    create_home: false
    state: present

- name: Creation de la racine du chroot
  ansible.builtin.file:
    path: "{{ sftp_dir }}/{{ sftp_user }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Creation du dossier d echange
  ansible.builtin.file:
    path: "{{ sftp_dir }}/{{ sftp_user }}/data"
    state: directory
    owner: "{{ sftp_user }}"
    group: "{{ sftp_group }}"
    mode: "0755"

- name: Configuration SFTP dediee
  ansible.builtin.template:
    src: sftp.conf.j2
    dest: /etc/ssh/sshd_config.d/50-netsys-sftp.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Redemarrer SSH

- name: Activation du service SSH
  ansible.builtin.service:
    name: ssh
    state: started
    enabled: true
