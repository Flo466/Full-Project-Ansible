---
- name: Mise a jour du cache APT
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Installation des paquets de base
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present

- name: Definition du nom d'hote
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

- name: Definition du fuseau horaire
  ansible.builtin.file:
    src: "/usr/share/zoneinfo/{{ common_timezone }}"
    dest: /etc/localtime
    state: link
    force: true

- name: Generation du fichier /etc/hosts
  ansible.builtin.template:
    src: hosts.j2
    dest: /etc/hosts
    owner: root
    group: root
    mode: "0644"
