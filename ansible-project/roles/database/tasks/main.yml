---
- name: Installation de MariaDB
  ansible.builtin.apt:
    name:
      - mariadb-server
      - python3-pymysql
    state: present

- name: Activation du service MariaDB
  ansible.builtin.service:
    name: mariadb
    state: started
    enabled: true

- name: Creation de la base de donnees
  community.mysql.mysql_db:
    name: "{{ db_name }}"
    state: present
    login_unix_socket: /run/mysqld/mysqld.sock

- name: Creation du compte applicatif
  community.mysql.mysql_user:
    name: "{{ db_user }}"
    password: "{{ db_password }}"
    priv: "{{ db_name }}.*:ALL"
    host: localhost
    state: present
    update_password: on_create
    login_unix_socket: /run/mysqld/mysqld.sock
